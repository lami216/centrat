<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EFC - أداة توليد ملفات التفعيل</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eef3f1;color:#17332b;font-family:Tahoma,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(760px,100%);background:#fff;border:1px solid #d7e1dd;border-radius:18px;box-shadow:0 18px 50px #143b2b1a;padding:26px}.head{border-bottom:1px solid #e4ebe8;padding-bottom:17px;margin-bottom:18px}.head h1{margin:0 0 7px;font-size:25px}.head p{margin:0;color:#70827b;font-size:12px;line-height:1.9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}label{display:grid;gap:7px;font-size:12px;font-weight:700}input,select,textarea{width:100%;border:1px solid #ccd9d4;border-radius:9px;padding:11px;background:#fbfcfc;color:#17332b;font:12px Tahoma,Arial}input[type=file]{padding:9px}textarea{min-height:78px;resize:vertical}.device{direction:ltr;text-align:left;font:700 13px Consolas,monospace}.note{font-size:11px;line-height:1.8;color:#71817c;background:#f7faf9;border-radius:9px;padding:10px 12px}.private{color:#17643b;background:#ecf8f1;border:1px solid #c8e8d5}.actions{display:flex;gap:9px;margin-top:17px}.actions button{flex:1;border:0;border-radius:10px;padding:13px 16px;background:#1469ad;color:white;font:700 13px Tahoma,Arial;cursor:pointer}.actions button:disabled{opacity:.55;cursor:not-allowed}.status{display:none;margin-top:14px;padding:11px 13px;border-radius:9px;font-size:12px;line-height:1.7}.status.error{display:block;background:#fff5f3;border:1px solid #f1d5cf;color:#8f3527}.status.ok{display:block;background:#ecf8f1;border:1px solid #c8e8d5;color:#17643b}.hours[hidden]{display:none}@media(max-width:650px){.card{padding:18px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
  <main class="card">
    <div class="head">
      <h1>أداة توليد ملفات تفعيل EFC</h1>
      <p>تعمل هذه الصفحة محليًا وبدون إنترنت. اختر مفتاح التفعيل الخاص v3 من جهازك، ثم أدخل بيانات العميل ورقم الجهاز.</p>
    </div>

    <div class="grid">
      <label>اسم العميل / المسؤول
        <input id="customerName" autocomplete="off" placeholder="اسم العميل" required>
      </label>
      <label>اسم المركز
        <input id="centerName" autocomplete="off" placeholder="اسم المركز" required>
      </label>
      <label class="full">رقم جهاز EFC
        <input id="deviceId" class="device" autocomplete="off" spellcheck="false" placeholder="EFC-XXXX-XXXX-XXXX-XXXX-XXXX" required>
      </label>
      <label>نوع التفعيل
        <select id="licenseType">
          <option value="perpetual">دائم</option>
          <option value="temporary">مؤقت</option>
        </select>
      </label>
      <label id="hoursWrap" class="hours" hidden>مدة التفعيل بالساعات
        <input id="durationHours" type="number" min="1" step="1" value="24">
      </label>
      <label class="full">ملاحظة اختيارية
        <textarea id="notes" placeholder="ملاحظة داخل ملف التفعيل فقط"></textarea>
      </label>
      <label class="full">المفتاح الخاص PKCS#8 PEM
        <input id="privateKeyFile" type="file" accept=".pem,.key,text/plain" required>
      </label>
      <div class="note private full">🔒 استخدم الملف EFC-license-master-private-v3.pem. المفتاح لا يُرفع ولا يُرسل لأي مكان، وتتم القراءة والتوقيع داخل المتصفح على هذا الجهاز فقط.</div>
    </div>

    <div class="actions"><button id="generate" type="button">إنشاء ملف التفعيل</button></div>
    <div id="status" class="status" role="status"></div>
  </main>

<script>
(()=>{
  'use strict';
  const LICENSE_SCHEMA='efc-license';
  const LICENSE_VERSION=1;
  const LICENSE_KEY_ID='efc-license-v3';
  const LICENSE_ALGORITHM='ECDSA_P256_SHA256';
  const PUBLIC_KEY_SEC1_B64='BDDLo6mYqhmQbaUyS_xmMkebb3Nz28ZmWU3bF6alhqeXt7mxLrk_pxDc4vaz9RXV5mICatMtADIQvkF4EdLM8LY';

  const $=id=>document.getElementById(id);
  const type=$('licenseType'),hoursWrap=$('hoursWrap'),button=$('generate'),status=$('status');

  function show(message,ok=false){status.className='status '+(ok?'ok':'error');status.textContent=message;}
  function clearStatus(){status.className='status';status.textContent='';}
  function validDeviceCode(value){return /^EFC(?:-[0-9A-Fa-f]{4}){5}$/.test(value);}
  function b64UrlToBytes(value){
    const normalized=value.replace(/-/g,'+').replace(/_/g,'/');
    const padded=normalized+'='.repeat((4-normalized.length%4)%4);
    const binary=atob(padded);return Uint8Array.from(binary,ch=>ch.charCodeAt(0));
  }
  function bytesToB64Url(bytes){
    let binary='';for(let offset=0;offset<bytes.length;offset+=0x8000)binary+=String.fromCharCode(...bytes.subarray(offset,Math.min(offset+0x8000,bytes.length)));
    return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function pemToDer(text){
    const match=text.match(/-----BEGIN PRIVATE KEY-----([\s\S]*?)-----END PRIVATE KEY-----/);
    if(!match)throw new Error('المفتاح يجب أن يكون بصيغة PKCS#8 PEM ويبدأ بـ BEGIN PRIVATE KEY.');
    const base64=match[1].replace(/\s+/g,'');
    if(!base64)throw new Error('ملف المفتاح الخاص فارغ.');
    const binary=atob(base64);return Uint8Array.from(binary,ch=>ch.charCodeAt(0));
  }
  async function importSigningKey(file){
    if(!crypto?.subtle)throw new Error('هذا المتصفح لا يدعم Web Crypto. افتح الأداة في Chrome أو Edge حديث.');
    const pem=await file.text();
    const key=await crypto.subtle.importKey('pkcs8',pemToDer(pem),{name:'ECDSA',namedCurve:'P-256'},false,['sign']);
    const publicKey=await crypto.subtle.importKey('raw',b64UrlToBytes(PUBLIC_KEY_SEC1_B64),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    const challenge=new TextEncoder().encode('EFC license private-key validation v3');
    const signature=new Uint8Array(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},key,challenge));
    if(signature.length!==64)throw new Error('صيغة توقيع ECDSA في هذا المتصفح غير مدعومة. استخدم Chrome أو Edge حديث.');
    const valid=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},publicKey,signature,challenge);
    if(!valid)throw new Error('هذا المفتاح الخاص لا يخص نسخة EFC الحالية. لم يتم إنشاء ملف تفعيل.');
    return key;
  }
  function makeLicenseId(){
    const random=new Uint8Array(6);crypto.getRandomValues(random);
    const suffix=[...random].map(byte=>byte.toString(16).padStart(2,'0').toUpperCase()).join('');
    return `EFC-${Math.floor(Date.now()/1000)}-${suffix}`;
  }
  function safeFilePart(value){return String(value).replace(/[^A-Za-z0-9_-]/g,'_');}
  function downloadText(filename,text){
    const blob=new Blob([text],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
  }
  function canonicalPayload(input){
    return {
      licenseId:input.licenseId,
      customerName:input.customerName,
      centerName:input.centerName,
      deviceId:input.deviceId,
      edition:'desktop',
      type:input.type,
      durationSeconds:input.durationSeconds,
      activationMode:'single-install',
      notes:input.notes
    };
  }

  type.addEventListener('change',()=>{hoursWrap.hidden=type.value!=='temporary';clearStatus();});
  button.addEventListener('click',async()=>{
    clearStatus();button.disabled=true;
    try{
      const customerName=$('customerName').value.trim();
      const centerName=$('centerName').value.trim();
      const deviceId=$('deviceId').value.trim().toUpperCase();
      const notes=$('notes').value.trim();
      const keyFile=$('privateKeyFile').files?.[0];
      if(!customerName)throw new Error('اسم العميل مطلوب.');
      if(!centerName)throw new Error('اسم المركز مطلوب.');
      if(!validDeviceCode(deviceId))throw new Error('رقم الجهاز غير صالح. انسخه من شاشة تفعيل EFC كما هو.');
      if(!keyFile)throw new Error('اختر ملف المفتاح الخاص EFC-license-master-private-v3.pem.');
      let durationSeconds=null;
      if(type.value==='temporary'){
        const hours=Number($('durationHours').value);
        if(!Number.isSafeInteger(hours)||hours<=0)throw new Error('أدخل مدة تفعيل صحيحة بالساعات.');
        durationSeconds=hours*3600;
        if(!Number.isSafeInteger(durationSeconds))throw new Error('مدة التفعيل كبيرة جدًا.');
      }
      const signingKey=await importSigningKey(keyFile);
      const payload=canonicalPayload({licenseId:makeLicenseId(),customerName,centerName,deviceId,type:type.value,durationSeconds,notes});
      const canonical=new TextEncoder().encode(JSON.stringify(payload));
      const signature=new Uint8Array(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},signingKey,canonical));
      if(signature.length!==64)throw new Error('صيغة التوقيع الناتجة غير متوافقة مع EFC.');
      const documentValue={schema:LICENSE_SCHEMA,version:LICENSE_VERSION,keyId:LICENSE_KEY_ID,algorithm:LICENSE_ALGORITHM,payload,signature:bytesToB64Url(signature)};
      const filename=`EFC-activation-${safeFilePart(payload.deviceId)}-${safeFilePart(payload.licenseId)}.efc-license`;
      downloadText(filename,JSON.stringify(documentValue,null,2));
      show(`تم إنشاء ملف التفعيل بنجاح: ${filename}`,true);
    }catch(error){console.error(error);show(error?.message||String(error));}
    finally{button.disabled=false;}
  });
})();
</script>
</body>
</html>
