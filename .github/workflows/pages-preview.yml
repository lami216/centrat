name: Centrat Branch Preview

on:
  push:
    branches:
      - fix/accounting-integrity-v21
      - feature/certificate-manager-receipt-bank-v22
      - feature/identity-editor-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: centrat-branch-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_status.outputs.enabled }}
    steps:
      - name: Checkout current working branch
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build browser preview
        run: npm run build

      - name: Detect GitHub Pages configuration
        id: pages_status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled for this new repository yet; keeping the preview as an Actions artifact."
          fi

      - name: Upload browser preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: centrat-browser-preview
          path: dist
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: efc-branch-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy current branch preview
        id: deployment
        uses: actions/deploy-pages@v4
